# A goal with the indexes is to have them general-purpose enough to not need
# frequent changing with stylesheet changes, but to be usable with many
# versions, and potentially other styles.

point:
  # The point table is small, but so are the partial indexes
  place:
    where: place IS NOT NULL AND name IS NOT NULL
  lowzoom_poi:
    # the only point features amenity-points / text-point can draw up to z13
    where: aeroway = 'aerodrome' OR "natural" IN ('peak', 'volcano') OR tourism IN ('alpine_hut', 'wilderness_hut') OR waterway = 'waterfall'
  midzoom_poi:
    # the only point features amenity-points / text-point can draw at z14-z15
    where: aeroway = 'aerodrome' OR amenity IN ('ferry_terminal', 'hospital') OR historic = 'castle' OR leisure = 'golf_course' OR man_made IN ('communications_tower', 'lighthouse', 'mast', 'telescope', 'tower') OR "natural" IN ('bay', 'cape', 'cave_entrance', 'peak', 'saddle', 'spring', 'strait', 'volcano') OR power = 'generator' OR tourism IN ('alpine_hut', 'wilderness_hut') OR waterway IN ('dam', 'waterfall', 'weir') OR tags->'mountain_pass' = 'yes'
  station:
    where: railway IN ('station', 'halt', 'tram_stop', 'subway_entrance') OR aerialway = 'station'
  junction:
    where: highway IN ('motorway_junction', 'traffic_signals') OR junction = 'yes'
line:
  label:
    where: name IS NOT NULL OR (tags @> 'golf=>hole'::hstore AND ref IS NOT NULL)
  ferry:
    where: route = 'ferry' AND osm_id > 0
  railway:
    where: railway IS NOT NULL
  river:
    where: waterway = 'river'
  waterway:
    where: waterway IN ('river', 'canal', 'stream', 'drain', 'ditch', 'fish_pass')
  aeroway:
    where: aeroway IN ('runway', 'taxiway')
  aerialway:
    where: aerialway IS NOT NULL OR man_made IN ('pipeline', 'goods_conveyor')
  roads_lowzoom:
    # the highway classes roads/tunnels/bridges select up to z11
    where: highway IN ('motorway', 'motorway_link', 'trunk', 'trunk_link', 'primary', 'primary_link', 'secondary', 'secondary_link', 'tertiary', 'tertiary_link', 'road', 'bus_guideway')
  man_made:
    where: man_made IN ('pier', 'breakwater', 'groyne')
polygon:
  # The polygon table is by far the largest, and generally the slowest
  name:
    function: ST_PointOnSurface(way)
    where: name IS NOT NULL
  name_z6:
    function: ST_PointOnSurface(way)
    where: name IS NOT NULL AND way_area > 5980000
  admin:
    function: ST_PointOnSurface(way)
    where: name IS NOT NULL AND boundary = 'administrative' AND admin_level IN ('0', '1', '2', '3', '4')
  nobuilding:
    where: building IS NULL
  lowzoom_poi:
    # polygon POIs drawn at any size up to z13 (the rest need way_area, see way_area_z6/z10)
    where: aeroway = 'aerodrome' OR tourism IN ('alpine_hut', 'wilderness_hut')
  midzoom_poi:
    # polygon POIs drawn at any size at z14-z15
    where: aeroway = 'aerodrome' OR amenity IN ('ferry_terminal', 'hospital') OR historic = 'castle' OR leisure = 'golf_course' OR man_made IN ('communications_tower', 'lighthouse', 'mast', 'telescope', 'tower') OR "natural" IN ('bay', 'cape', 'spring', 'strait') OR power = 'generator' OR tourism IN ('alpine_hut', 'wilderness_hut') OR waterway = 'dam' OR tags->'mountain_pass' = 'yes'
  station:
    where: railway IN ('station', 'halt', 'tram_stop', 'subway_entrance') OR aerialway = 'station'
  junction:
    where: junction = 'yes'
  tourism_boundary:
    where: tourism IN ('theme_park', 'zoo')
  protected_area:
    where: boundary IN ('aboriginal_lands', 'national_park', 'protected_area') OR leisure = 'nature_reserve'
  man_made:
    where: man_made IN ('pier', 'breakwater', 'groyne', 'bridge')
  military:
    where: (landuse = 'military' OR military = 'danger_area') AND building IS NULL
  water:
    where: waterway IN ('dock', 'riverbank') OR landuse IN ('reservoir', 'basin') OR "natural" IN ('water', 'glacier')
  way_area_z6:
    where: way_area > 5980000
  way_area_z10:
    where: way_area > 23300
roads:
  # The roads table only has a subset of data, so it's just got some low-zoom
  # indexes and some fairly selective ones for high zoom
  admin_low:
    where: boundary = 'administrative' AND admin_level IN ('0', '1', '2', '3', '4') AND osm_id < 0
  admin:
    where: boundary = 'administrative' AND osm_id < 0
  roads_ref:
    where: highway IS NOT NULL AND ref IS NOT NULL
